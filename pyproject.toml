[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd-iar"
version = "0.1.0"
description = "Investigative autoregressive retrieval over Progressive Disclosure Documentation artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bacoco" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pdd-iar = "pdd_iar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
